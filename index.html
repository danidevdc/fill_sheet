<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Registro</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="form-wrapper">
            <h1>Formulario de Registro</h1>
            <p class="subtitle">Por favor, completa todos los campos requeridos</p>

            <form id="registrationForm">
                <div class="form-group">
                    <label for="nombre">Nombre Completo <span class="required">*</span></label>
                    <input
                        type="text"
                        id="nombre"
                        name="nombre"
                        placeholder="Ingresa tu nombre completo"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">Correo Electrónico <span class="required">*</span></label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="ejemplo@correo.com"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="telefono">Teléfono <span class="required">*</span></label>
                    <input
                        type="tel"
                        id="telefono"
                        name="telefono"
                        placeholder="+57 300 123 4567"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="empresa">Empresa/Organización</label>
                    <input
                        type="text"
                        id="empresa"
                        name="empresa"
                        placeholder="Nombre de tu empresa (opcional)"
                    >
                </div>

                <div class="form-group">
                    <label for="ciudad">Ciudad <span class="required">*</span></label>
                    <input
                        type="text"
                        id="ciudad"
                        name="ciudad"
                        placeholder="Tu ciudad"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="comentarios">Comentarios</label>
                    <textarea
                        id="comentarios"
                        name="comentarios"
                        rows="4"
                        placeholder="Escribe tus comentarios aquí (opcional)"
                    ></textarea>
                </div>

                <button type="submit" class="submit-btn" id="submitBtn">
                    <span class="btn-text">Enviar Formulario</span>
                    <span class="spinner" style="display: none;"></span>
                </button>

                <div id="message" class="message"></div>
            </form>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>
